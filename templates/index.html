<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CropAI – Smart Detection</title>
    <style>
        body {
            font-family: "Segoe UI", sans-serif;
            background: linear-gradient(135deg, #e8f5e9, #f1f8e9);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background: white;
            width: 420px;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
        }

        h1 {
            margin-bottom: 10px;
            color: #2e7d32;
        }

        .sub {
            font-size: 14px;
            color: #666;
            margin-bottom: 20px;
        }

        input[type="file"] {
            margin: 15px 0;
        }

        button {
            background: #2e7d32;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #1b5e20;
        }

        .result {
            margin-top: 20px;
        }

        .crop {
            font-size: 22px;
            font-weight: bold;
            color: #2e7d32;
        }

        .confidence-bar {
            height: 12px;
            background: #e0e0e0;
            border-radius: 6px;
            overflow: hidden;
            margin: 10px 0;
        }

        .confidence-fill {
            height: 100%;
            background: linear-gradient(to right, #66bb6a, #2e7d32);
        }

        img {
            width: 100%;
            border-radius: 12px;
            margin-top: 15px;
        }

        .agent {
            font-size: 14px;
            color: #555;
            margin-top: 10px;
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>🌱 CropAI</h1>
    <div class="sub">AI Agent for Crop Detection</div>

    <form method="POST" enctype="multipart/form-data">
        <input type="file" name="file" required>
        <br>
        <button type="submit">Analyze Image 🤖</button>
    </form>

    {% if prediction %}
    <div class="result">
        <div class="agent">🧠 AI Analysis Complete</div>
        <div class="crop">Detected: {{ prediction }}</div>

        <div class="confidence-bar">
            <div class="confidence-fill" style="width: {{ confidence }}%"></div>
        </div>
        <div>{{ confidence }}% confidence</div>

        <img src="{{ image_path }}">
    </div>
    {% endif %}
</div>

</body>
</html>
